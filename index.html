<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Luna Roja Chat</title>
<style>
body { font-family: Arial; background: #ffe6e6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
#chatContainer { background: #fff; padding: 20px; border-radius: 10px; width: 400px; box-shadow: 0 0 10px rgba(0,0,0,0.2); }
#messages { height: 300px; overflow-y: auto; border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; }
.message { margin: 5px 0; }
.user { color: blue; }
.luna { color: red; }
</style>
</head>
<body>
<div id="chatContainer">
  <div id="messages"></div>
  <input id="userInput" type="text" placeholder="Escribe tu mensaje..." style="width:80%;" />
  <button onclick="sendMessage()">Enviar</button>
</div>
<script>
const messagesDiv = document.getElementById('messages');
function addMessage(sender, text) {
  const msg = document.createElement('div');
  msg.className = 'message ' + sender;
  msg.textContent = text;
  messagesDiv.appendChild(msg);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}
function sendMessage() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if(!text) return;
  addMessage('user', text);
  input.value = '';
  fetch('/message', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({text}) })
    .then(res => res.json())
    .then(data => addMessage('luna', data.reply));
}
</script>
</body>
</html>
